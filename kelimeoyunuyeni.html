<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime Yarışması · Mıntıka</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#12293f; --paper:#FBF7F0; --chalk:#E8E2D6; --gold:#C8A44D;
  --teal:#1F6F6B; --rose:#B2453C; --muted:#94a0b8; --green:#4EA87C;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 15% -12%,#6b5b95 0%,var(--ink) 62%);
  background-attachment:fixed;color:var(--chalk);font-family:'Inter',system-ui,-apple-system,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:26px 18px 80px}
.hdr{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:26px}
h1{font-family:Georgia,'Times New Roman',serif;font-size:30px;margin:0;letter-spacing:-.02em;color:var(--paper);cursor:pointer}
h1 span{color:var(--gold)}
h2,h3{font-family:Georgia,serif}
.sub{font-size:13px;color:var(--muted)}
.card{background:rgba(251,247,240,.06);border:1px solid rgba(232,226,214,.14);border-radius:14px;padding:20px;margin-bottom:18px}
.btn{cursor:pointer;border:none;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;font-family:inherit;transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--gold);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--chalk);border:1px solid rgba(232,226,214,.3)}
.btn-danger{background:rgba(178,69,60,.18);color:#f0a49d;border:1px solid rgba(178,69,60,.5)}
.btn-sm{padding:7px 12px;font-size:13px}
input,select,textarea{width:100%;background:rgba(14,22,32,.55);border:1px solid rgba(232,226,214,.22);color:var(--chalk);border-radius:9px;padding:11px 13px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
select option{background:var(--ink);color:var(--chalk)}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid rgba(232,226,214,.15)}
td{padding:9px 10px;border-bottom:1px solid rgba(232,226,214,.07)}
tr.top1 td{background:rgba(200,164,77,.12)}
tr.me td{background:rgba(31,111,107,.18)}
.tab{cursor:pointer;padding:9px 16px;border-radius:999px;font-size:14px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit}
.tab.on{background:rgba(200,164,77,.16);color:var(--gold);border-color:rgba(200,164,77,.4)}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;border-radius:12px;border:1.5px solid rgba(232,226,214,.18);
  background:rgba(251,247,240,.04);color:var(--chalk);font-size:17px;cursor:pointer;font-family:inherit;margin-bottom:10px;transition:all .12s}
.opt:hover{border-color:var(--gold);background:rgba(200,164,77,.08)}
.opt.sel{border-color:var(--gold);background:rgba(200,164,77,.14)}
.opt.correct{border-color:var(--green);background:rgba(78,168,124,.18)}
.opt.wrong{border-color:var(--rose);background:rgba(178,69,60,.18)}
.opt[disabled]{opacity:.4;cursor:not-allowed}

/* --- Talebe menusu renkli kartlar --- */
.mcard{position:relative;overflow:hidden;display:block;width:100%;text-align:left;
  padding:22px 20px 20px;border-radius:16px;cursor:pointer;font-family:inherit;color:var(--chalk);
  background:rgba(251,247,240,.05);
  border:1px solid rgba(232,226,214,.12);transition:transform .16s,box-shadow .16s,border-color .16s,background .16s}
.mcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc)}
.mcard:hover{transform:translateY(-4px);border-color:var(--mc);box-shadow:0 12px 28px -12px var(--mcs);background:rgba(251,247,240,.09)}
.mcard[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.mcard .mci{font-size:30px;line-height:1;margin-bottom:12px;display:block}
.mcard .mct{font-weight:700;font-size:17px;color:var(--paper)}
.mcard .mcd{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}
.mcard .mcbadge{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:999px;background:var(--mc);color:#12293f}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.talebe-basi{background:linear-gradient(135deg,rgba(200,164,77,.14),rgba(31,111,107,.1));
  border:1px solid rgba(232,226,214,.15);border-radius:18px;padding:26px 22px;text-align:center;margin-bottom:18px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:rgba(31,111,107,.25);color:#7fd4cf}
.yb{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bar{height:5px;background:rgba(232,226,214,.12);border-radius:99px;margin-bottom:26px}
.bar>div{height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);
  padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;z-index:99}
.hide{display:none}
.big{font-family:Georgia,serif;font-size:40px;margin:14px 0 4px;color:var(--paper)}
.score{font-family:Georgia,serif;font-size:72px;color:var(--gold);line-height:1.1;margin:10px 0}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-size:24px;color:var(--paper)}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.timer{font-size:22px;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
details summary{cursor:pointer;color:var(--gold);font-size:14px;margin-bottom:10px}
.listrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(232,226,214,.07)}
.tick{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:14px;font-weight:700;cursor:default}
.tick.ok{background:rgba(78,168,124,.22);color:#7fd4a0;border:1px solid rgba(78,168,124,.45)}
.tick.no{background:rgba(178,69,60,.18);color:#f0a49d;border:1px solid rgba(178,69,60,.45)}

/* --- yurt kartlari --- */
.dorms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:30px}
.dorm{position:relative;overflow:hidden;padding:22px 20px;border-radius:16px;cursor:pointer;text-align:left;
  border:1px solid rgba(232,226,214,.16);background:rgba(251,247,240,.05);color:var(--chalk);font-family:inherit;
  transition:transform .14s,border-color .14s,background .14s}
.dorm:hover{transform:translateY(-3px);border-color:var(--gold);background:rgba(200,164,77,.08)}
.dorm:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.dorm .bar4{position:absolute;left:0;top:0;bottom:0;width:5px}
.dorm .nm{font-family:Georgia,serif;font-size:24px;color:var(--paper);margin-bottom:5px}
.dorm .mt{font-size:13px;color:var(--muted)}

/* --- mintika vitrini --- */
.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:900px){.panels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.panels{grid-template-columns:1fr}}
.panel{background:rgba(251,247,240,.05);border:1px solid rgba(232,226,214,.13);border-radius:14px;padding:16px;min-height:300px;min-width:0;overflow:hidden}
.panel h3{margin:0 0 4px;font-size:19px;color:var(--paper)}
.clsdots{display:flex;gap:5px;margin:10px 0 12px}
.dot{cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;
  border:1px solid rgba(232,226,214,.2);background:transparent;color:var(--muted)}
.dot.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.panel table{font-size:13px;table-layout:fixed;width:100%}
.panel td{padding:5px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel th{padding:5px 4px;font-size:9px;letter-spacing:.05em}
.rk{width:26px;color:var(--muted);font-variant-numeric:tabular-nums}
.fade{animation:fi .45s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:99px;background:var(--green);display:inline-block;animation:pl 1.6s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
/* ── Ana yerlesim: paneller + rekor sutunu ── */
.anaduzen{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;align-items:start}
@media(max-width:1250px){.anaduzen{grid-template-columns:1fr}}

/* ── Rekorlar sutunu ── */
.rekor{background:rgba(251,247,240,.05);border:1px solid rgba(232,226,214,.13);
  border-radius:14px;padding:14px 12px 10px;position:sticky;top:16px}
.rk-bas{padding:0 4px 10px;border-bottom:1px solid rgba(232,226,214,.12);margin-bottom:8px}
.rk-bas h3{margin:0;font-size:18px;color:var(--paper)}
.rk-bas span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.rk-pencere{height:620px;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 7%,#000 93%,transparent)}
@media(max-width:1250px){.rk-pencere{height:420px}}
.rk-akis{animation:rkKay 90s linear infinite;will-change:transform}
.rk-pencere:hover .rk-akis{animation-play-state:paused}
@keyframes rkKay{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.rk-row{display:flex;align-items:center;gap:8px;padding:7px 5px;
  border-bottom:1px solid rgba(232,226,214,.06)}
.rk-row.rk-top{background:rgba(200,164,77,.09);border-radius:7px}
.rk-no{width:26px;flex-shrink:0;text-align:center;font-size:12px;
  color:var(--muted);font-variant-numeric:tabular-nums}
.rk-ad{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--chalk);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-alt{display:block;font-size:10px;font-weight:400;color:var(--muted);
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-alt .yb{padding:1px 5px;font-size:9px;margin-right:4px}
.rk-puan{flex-shrink:0;font-size:14px;font-weight:700;color:var(--gold);
  font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.rk-akis{animation:none}
  .rk-pencere{overflow-y:auto}}

@keyframes yuk{0%{margin-left:-35%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1 onclick="goHome()">Kelime <span>Yarışması</span></h1>
    <span class="sub" id="sub">Mıntıka · 5–8. Sınıf</span>
    <span style="flex:1"></span>
    <span id="who"></span>
  </div>
  <div id="app"><div class="card" style="text-align:center;padding:48px 24px">
    <div style="font-size:15px;color:var(--muted)">Yükleniyor…</div>
    <div style="margin-top:14px;height:4px;background:rgba(232,226,214,.12);border-radius:99px;overflow:hidden">
      <div style="height:100%;width:35%;background:var(--gold);border-radius:99px;animation:yuk 1.1s ease-in-out infinite"></div>
    </div></div></div>
</div>
<div id="toast" class="toast hide"></div>
<script>
/* ══════════════════════════════════════════════════════════════════
   BÖLÜM 1 — VERİ KATMANI
   ------------------------------------------------------------------
   Buradaki DB nesnesi verinin nereden okunup nereye yazılacağını
   belirler. Şu anda tarayıcı hafızası (localStorage) kullanıyor.

   ORTAK VERİTABANINA GEÇMEK İÇİN (Firebase / Supabase / kendi API'niz):
   Sadece aşağıdaki 6 fonksiyonun içini değiştirin. Arayüzün geri
   kalanına dokunmanıza gerek yok.

     DB.load()               -> {words, students, results} döndürmeli (async)
     DB.saveWords(w)         -> ortak kelime listesini yazar
     DB.saveStudents(s)      -> {yurt: {sınıf: [isim,...]}} yazar
     DB.addResult(r)         -> TEK bir yarışma sonucu ekler (append)
     DB.replaceResults(list) -> tüm sonuç listesini değiştirir (silme için)
     DB.watch(fn)            -> veri değişince fn() çağrılır (canlı sıralama)

   Örnek Supabase uyarlaması dosyanın en altında yorum olarak var.
   ══════════════════════════════════════════════════════════════════ */

const LS = {
  words: 'ky_words', students: 'ky_students', results: 'ky_results', pass: 'ky_adminpass'
};

// ─── SUPABASE BAĞLANTISI ───────────────────────────────────────────
// Kendi proje bilgilerinizi girin (Supabase Dashboard > Settings > API):
const SUPABASE_URL      = 'https://zowvygqlbrtotkygszsg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpvd3Z5Z3FsYnJ0b3RreWdzenNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDIwOTAsImV4cCI6MjA5MTY3ODA5MH0.jUOcm2ZRL8VlAxLLWMj6unoDl7981lndSyQFji18w0A';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DB = {
  async load(){
    const [w, s, r, y] = await Promise.all([
      sb.from('ayarlar').select('deger').eq('anahtar','words').maybeSingle(),
      sb.from('ayarlar').select('deger').eq('anahtar','students').maybeSingle(),
      sb.from('sonuclar').select('*').order('date'),
      sb.from('ayarlar').select('deger').eq('anahtar','dorms').maybeSingle()
    ]);
    return {
      words:    w.data ? w.data.deger : null,
      students: s.data ? s.data.deger : null,
      dorms:    y.data ? y.data.deger : null,
      results:  (r.data || []).map(row => ({
        id: row.id, dorm: row.dorm, name: row.name, cls: row.cls, unit: row.unit,
        correct: row.correct, total: row.total, seconds: row.seconds,
        score: row.score, wrongs: row.wrongs, date: Number(row.date)
      }))
    };
  },
  async saveWords(w){
    const { error } = await sb.from('ayarlar').upsert({ anahtar:'words', deger:w });
    if (error) console.error(error);
    return !error;
  },
  async saveStudents(s){
    const { error } = await sb.from('ayarlar').upsert({ anahtar:'students', deger:s });
    if (error) console.error(error);
    return !error;
  },
  async saveDorms(d){
    const { error } = await sb.from('ayarlar').upsert({ anahtar:'dorms', deger:d });
    if (error) console.error(error);
    return !error;
  },
  async deleteDormResults(dormId){
    const { error } = await sb.from('sonuclar').delete().eq('dorm', dormId);
    if (error) console.error(error);
    return !error;
  },
  // Antrenman ustalik sayaclari — talebe basina tek satir, ayarlar tablosunda.
  async loadMastery(anahtar){
    const { data, error } = await sb.from('ayarlar').select('deger').eq('anahtar', anahtar).maybeSingle();
    if (error){ console.error(error); return {}; }
    return data ? (data.deger || {}) : {};
  },
  async saveMastery(anahtar, deger){
    const { error } = await sb.from('ayarlar').upsert({ anahtar, deger });
    if (error) console.error(error);
    return !error;
  },
  async addResult(r){
    const { error } = await sb.from('sonuclar').insert(r);
    if (error) console.error(error);
    return !error;
  },
  async replaceResults(list){
    const { error: delErr } = await sb.from('sonuclar').delete().neq('id','');
    if (delErr) console.error(delErr);
    if (list.length){
      const { error } = await sb.from('sonuclar').insert(list);
      if (error) console.error(error);
    }
    return true;
  },
  watch(fn){
    sb.channel('ky-canli')
      .on('postgres_changes', { event:'*', schema:'public', table:'sonuclar' }, fn)
      .on('postgres_changes', { event:'*', schema:'public', table:'ayarlar' }, fn)
      .subscribe();
  }
};

function ls(k, f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

/* ══════════════════════════════════════════════════════════════════
   BÖLÜM 2 — SABİTLER
   ══════════════════════════════════════════════════════════════════ */

const CLASSES = [5,6,7,8];
const UNITS   = [1,2,3,4];
const TOTAL_Q = 100;          // her test tam 100 soru
const TOP_N   = 20;           // vitrinde gösterilecek talebe sayısı
const ROTATE_MS = 6000;       // vitrin sınıf değiştirme aralığı

// Varsayilan yurtlar. Veritabaninda kayit yoksa bunlar kullanilir ve yazilir.
// Bayrampasa yonetici panelinden duzenlenebilir.
const VARSAYILAN_YURTLAR = [
  { id:'suirici',      name:'Suriçi',        pass:'sts1453',    color:'#C8A44D' },
  { id:'bayrampasa',   name:'Bayrampaşa',    pass:'1071',       color:'#4EA87C' },
  { id:'cibali',       name:'Cibali',        pass:'cibali1453', color:'#5B9BD5' },
  { id:'sehitkamilbey',name:'Seyitkamilbey', pass:'skb1453',    color:'#C77DBB' }
];
let DORMS = VARSAYILAN_YURTLAR.map(d => ({...d}));
const ADMIN_PASS_DEFAULT = '145312345';   // her yurdun yönetici paneli şifresi

// Kelime listelerini SADECE bu yurt düzenleyebilir. Diğerleri görebilir ama değiştiremez.
// Yetkiyi başka bir yurda vermek için aşağıdaki id'yi değiştirin
// ('suirici' | 'bayrampasa' | 'cibali' | 'sehitkamilbey').
const WORD_ADMIN = 'bayrampasa';

const dorm  = id => DORMS.find(d => d.id === id)
              || { id, name:'(silinmiş yurt)', pass:'', color:'#6B7280' };
const canEditWords = () => S.dorm === WORD_ADMIN;
const wkey  = (c,u) => c + '-' + u;

/* ══════════════════════════════════════════════════════════════════
   BÖLÜM 3 — YARDIMCILAR
   ══════════════════════════════════════════════════════════════════ */

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
const trSort = (a,b) => a.localeCompare(b,'tr');

function flash(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.remove('hide');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.add('hide'), 2200);
}

/* ══════════════════════════════════════════════════════════════════
   HAZIR KELİME LİSTELERİ — 16 ünite
   ------------------------------------------------------------------
   PDF'lerden aktarılmıştır. Uygulama ilk açıldığında yüklenir.
   Bayrampaşa yönetici panelinden düzenlenebilir / silinebilir.

let words = {};        // { "5-1": [{en,tr},...] }  — TÜM YURTLARDA ORTAK
let students = {};     // { yurtId: { "5": [isim,...] } }  — yurda özel
let results = [];      // [{id,dorm,name,cls,unit,correct,total,seconds,score,wrongs,date}]
let adminPass = ADMIN_PASS_DEFAULT;

const S = {
  screen: 'gate',      // gate | mintika | rekorlar | dorm | setup | talebeMenu | wrongOut | drill | quiz | result | admin

/* ══════════════════════════════════════════════════════════════════
   BÖLÜM 5 — YÖNLENDİRME
   ══════════════════════════════════════════════════════════════════ */

function render(){
  const views = { gate, mintika, rekorlar, dorm:dormHome, setup, setupUnit, talebeMenu, wrongList, wrongOut, drill:drillScreen, quiz, result, admin };
  document.getElementById('app').innerHTML = views[S.screen]();
  document.getElementById('who').innerHTML = S.dorm
    ? `<span class="row" style="gap:8px">
       <span class="yb" style="background:${dorm(S.dorm).color}22;color:${dorm(S.dorm).color};border:1px solid ${dorm(S.dorm).color}55">${esc(dorm(S.dorm).name)}</span>
       <button class="btn btn-ghost btn-sm" onclick="go('admin')">Yönetici</button>
       <button class="btn btn-ghost btn-sm" onclick="logout()">Çıkış</button></span>`
    : '';
  document.getElementById('sub').textContent = S.dorm ? dorm(S.dorm).name + ' Yurdu' : 'Mıntıka · 5–8. Sınıf';
}

function goHome(){ if(S.screen==='quiz') return; stopRotation(); S.screen = S.dorm ? 'setup' : 'gate'; S.bAll=false; render(); }
function go(s){ if(s!=='mintika') stopRotation(); S.screen = s; S.bAll = false; render(); }
function openMintika(){ if(!S.dorm) return; go('mintika'); startRotation(); }
function logout(){ S.dorm=null; S.auth=false; S.picked=null; S.q=''; S.unit=null; stopRotation(); go('gate'); }

/* ══════════════════════════════════════════════════════════════════
   BÖLÜM 6 — GİRİŞ EKRANI + MINTIKA VİTRİNİ
   ══════════════════════════════════════════════════════════════════ */

function gate(){
  let h = `<div class="card" style="text-align:center;padding:26px 20px;margin-bottom:20px">
    <h2 style="margin:0 0 8px;font-size:22px">Yurdunuzu seçin</h2>
    <p style="color:var(--muted);font-size:14px;margin:0">
      Mıntıka sıralamalarını görmek için önce yurt şifresiyle giriş yapın.</p>
  </div>`;

  h += '<div class="dorms">';
  DORMS.forEach(d => {
    if (S.askPass === d.id){
      h += `<div class="dorm" style="cursor:default;border-color:${d.color}">
        <span class="bar4" style="background:${d.color}"></span>
        <div class="nm">${esc(d.name)}</div>
        <input id="dp" type="password" placeholder="Yurt şifresi" style="margin:10px 0 8px"
          onkeydown="if(event.key==='Enter')tryDorm('${d.id}')">
        <div class="row">
          <button class="btn btn-primary btn-sm" onclick="tryDorm('${d.id}')">Gir</button>
          <button class="btn btn-ghost btn-sm" onclick="S.askPass=null;render()">Vazgeç</button>
        </div></div>`;
    } else {
      h += `<button class="dorm" onclick="S.askPass='${d.id}';render();focusPass()">
        <span class="bar4" style="background:${d.color}"></span>
        <div class="nm">${esc(d.name)}</div>
        <div class="mt">Giriş için tıklayın</div></button>`;
    }
  });
  h += '</div>';
  return h;
}

/* ── MINTIKA VİTRİNİ — sadece giriş yaptıktan sonra görünür ───────── */
function mintika(){
  if (!S.dorm){ S.screen='gate'; return gate(); }

  let h = `<div class="row" style="margin-bottom:22px">
    <button class="btn btn-ghost" style="padding:14px 24px" onclick="go('dorm')">← Yurt Ekranı</button>
    <button class="btn btn-primary" style="padding:14px 24px" onclick="go('rekorlar')">🏆 Rekorlar</button>
  </div>`;

  if (!results.length){
    const kelimeVar = Object.keys(words).length > 0;
    const talebeVar = Object.values(students).some(y => Object.values(y||{}).some(l => l && l.length));
    h += `<div class="card" style="text-align:center;padding:38px 24px">
      <h2 style="margin:0 0 10px;font-size:22px">Mıntıka Sonuçları</h2>
      <p style="color:var(--muted);font-size:15px;margin:0 auto;max-width:520px">
        Henüz yarışma yapılmadı. İlk sonuçlar geldiğinde ünite ünite sıralamalar burada görünecek.</p>
      <div style="margin-top:22px;display:inline-block;text-align:left;font-size:14px;color:var(--muted)">
        <div style="margin-bottom:7px">${talebeVar?'✓':'○'} Yönetici Panelinden talebeleri ekleyin</div>
        <div style="margin-bottom:7px">${kelimeVar?'✓':'○'} Sınıf ve ünitelere kelimeleri girin (tüm yurtlarda ortak)</div>
        <div>○ Yarışmaya başlayın</div>
      </div></div>`;
    return h;
  }

  h += `<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:12px">
    <h2 style="margin:0;font-size:22px">Mıntıka Sonuçları</h2>
    <span class="live"><i></i> Tüm yurtlar · ilk ${TOP_N} · sınıflar sırayla</span></div>`;

  h += '<div class="panels">' + UNITS.map(u => panelHTML(u)).join('') + '</div>';
  return h;
}

/* ── DETAYLI REKORLAR EKRANI ─────────────────────────────────────── */
function rekorlar(){
  if (!S.dorm){ S.screen='gate'; return gate(); }

  let h = `<div class="row" style="margin-bottom:22px">
    <button class="btn btn-ghost" style="padding:14px 24px" onclick="go('mintika')">← Mıntıka Ekranı</button>
  </div>`;

  const tum = [...results].sort((a,b) => b.score - a.score || a.seconds - b.seconds);
  if (!tum.length){
    h += '<div class="card"><p style="color:var(--muted);margin:0">Henüz sonuç yok.</p></div>';
    return h;
  }

  // Filtre cubugu
  h += `<div class="card"><div class="row" style="gap:14px;align-items:flex-end;flex-wrap:wrap">
    <div style="min-width:150px"><label>Yurt</label>
      <select onchange="S.rDorm=this.value;render()">
        <option value="hepsi" ${S.rDorm==='hepsi'?'selected':''}>Tüm yurtlar</option>
        ${DORMS.map(d=>`<option value="${d.id}" ${S.rDorm===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select></div>
    <div style="min-width:120px"><label>Sınıf</label>
      <select onchange="S.rCls=this.value;render()">
        <option value="hepsi" ${S.rCls==='hepsi'?'selected':''}>Tüm sınıflar</option>
        ${CLASSES.map(c=>`<option value="${c}" ${S.rCls==String(c)?'selected':''}>${c}. Sınıf</option>`).join('')}
      </select></div>
    <div style="min-width:120px"><label>Ünite</label>
      <select onchange="S.rUnit=this.value;render()">
        <option value="hepsi" ${S.rUnit==='hepsi'?'selected':''}>Tüm üniteler</option>
        ${UNITS.map(u=>`<option value="${u}" ${S.rUnit==String(u)?'selected':''}>Ünite ${u}</option>`).join('')}
      </select></div>
    <div style="flex:1;min-width:180px"><label>Talebe ara</label>
      <input value="${esc(S.rQ)}" placeholder="Ad yaz…" oninput="S.rQ=this.value;render()"></div>
  </div></div>`;

  // Filtreleme
  const q = S.rQ.toLocaleLowerCase('tr');
  const f = tum.filter(r =>
    (S.rDorm === 'hepsi' || r.dorm === S.rDorm) &&
    (S.rCls  === 'hepsi' || r.cls  === +S.rCls) &&
    (S.rUnit === 'hepsi' || r.unit === +S.rUnit) &&
    (!q || r.name.toLocaleLowerCase('tr').includes(q))
  );

  h += `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:14px">
      <h2 style="margin:0;font-size:20px">Rekorlar</h2>
      <span style="color:var(--muted);font-size:13px">${f.length} kayıt</span>
    </div>`;

  if (!f.length){
    h += '<p style="color:var(--muted);font-size:14px;margin:0">Bu filtreye uyan sonuç yok.</p></div>';
    return h;
  }

  h += `<table><thead><tr>
      <th style="width:50px">#</th><th>Talebe</th><th>Yurt</th>
      <th>Sınıf</th><th>Ünite</th><th>Doğru</th><th>Süre</th><th>Tarih</th><th>Puan</th>
    </tr></thead><tbody>`
    + f.slice(0, S.rAll ? f.length : 50).map((r,i) => {
        const d = dorm(r.dorm);
        const t = new Date(r.date);
        const ts = String(t.getDate()).padStart(2,'0') + '.' +
                   String(t.getMonth()+1).padStart(2,'0') + '.' + t.getFullYear();
        return `<tr class="${i===0?'top1':''}">
          <td>${medal(i)}</td>
          <td style="font-weight:600">${esc(r.name)}</td>
          <td><span class="yb" style="background:${d.color}22;color:${d.color}">${esc(d.name)}</span></td>
          <td>${r.cls}. Sınıf</td><td>Ünite ${r.unit}</td>
          <td>${r.correct}/${r.total}</td><td>${fmt(r.seconds)}</td>
          <td style="color:var(--muted);font-size:13px">${ts}</td>
          <td style="color:var(--gold);font-weight:700">${r.score}</td></tr>`;
      }).join('')
    + '</tbody></table>';

  if (f.length > 50){
    h += `<button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="S.rAll=!S.rAll;render()">`
       + (S.rAll ? 'İlk 50 göster' : `Tümünü göster (${f.length})`) + '</button>';
  }
  h += '</div>';
  return h;
}

function focusPass(){ const e = document.getElementById('dp'); if(e) e.focus(); }

/* Yurt kartlarindaki "N talebe · M yarisma" yazilarini, tum ekrani
   yeniden cizmeden gunceller. Boylece rekor listesinin kaymasi bozulmaz. */
function yurtKartSayilari(){
  const kartlar = document.querySelectorAll('.dorm .mt');
  if (!kartlar || !kartlar.length) return;
  let i = 0;
  DORMS.forEach(d => {
    if (S.askPass === d.id) return;   // sifre kutusu acik olan kartta .mt yok
    const el = kartlar[i++];
    if (!el) return;
    const st = Object.values(students[d.id] || {}).reduce((a,c)=>a+(c?c.length:0), 0);
    const rs = results.filter(r => r.dorm === d.id).length;
    el.textContent = st + ' talebe · ' + rs + ' yarışma';
  });
}

function tryDorm(id){
  const el = document.getElementById('dp');
  const v = (el ? el.value : '').trim().toLocaleLowerCase('tr');
  // Buyuk/kucuk harf farki yok sayilir (telefonlarda ilk harf otomatik buyuyor).
  if (v === dorm(id).pass.toLocaleLowerCase('tr')){
    S.dorm = id; S.askPass = null; S.auth = false;
    S.q=''; S.picked=null; S.unit=null;
    stopRotation();
    go('setup');
  } else {
    flash('Şifre yanlış.');
    if(el){ el.value=''; el.focus(); }
  }
}

/* --- vitrin panelleri --- */

function panelHTML(u){
  const c = S.panelCls[u];
  const rows = mintikaTop(c, u);
  let h = `<div class="panel"><h3>Ünite ${u}</h3>
    <div class="clsdots">`;
  CLASSES.forEach(k => {
    h += `<button class="dot ${k===c?'on':''}" onclick="setPanel(${u},${k})">${k}</button>`;
  });
  h += `</div><div id="pb${u}" class="fade">${panelBody(rows)}</div></div>`;
  return h;
}

function panelBody(rows){
  if (!rows.length) return `<p style="color:var(--muted);font-size:13px;padding:8px 0">Bu sınıf ve ünitede henüz sonuç yok.</p>`;
  return `<table><colgroup><col style="width:26px"><col><col style="width:46px"><col style="width:26px"><col style="width:42px"><col style="width:40px"></colgroup>
    <thead><tr><th class="rk">#</th><th>Talebe</th><th>Yurt</th><th>D</th><th>Süre</th><th>Puan</th></tr></thead><tbody>`
    + rows.map((r,i) => {
        const d = dorm(r.dorm);
        return `<tr class="${i===0?'top1':''}"><td class="rk">${medal(i)}</td>
          <td style="font-weight:600" title="${esc(r.name)}">${esc(r.name)}</td>
          <td><span class="yb" style="background:${d.color}22;color:${d.color}">${esc(d.name.slice(0,4))}</span></td>
          <td>${r.correct}</td><td>${fmt(r.seconds)}</td>
          <td style="color:var(--gold);font-weight:700">${r.score}</td></tr>`;
      }).join('')
    + '</tbody></table>';
}

// Belirli sınıf+ünite için TÜM yurtlardan en iyi skorlar (talebe başına 1 kayıt)
function mintikaTop(cls, unit){
  const f = results.filter(r => r.cls === cls && r.unit === unit);
  const m = new Map();
  f.forEach(r => {
    const k = r.dorm + '|' + r.name;
    const cur = m.get(k);
    if (!cur || r.score > cur.score) m.set(k, r);
  });
  return [...m.values()].sort((a,b) => b.score - a.score || a.seconds - b.seconds).slice(0, TOP_N);
}

function setPanel(u, c){
  S.panelCls[u] = c;
  S.panelLock[u] = true;                       // elle seçildi -> döngü durur
  const el = document.getElementById('pb'+u);
  if (el){ el.innerHTML = panelBody(mintikaTop(c,u)); }
  // nokta işaretlerini tazele
  render();
}

let _rot = null;
function startRotation(){
  stopRotation();
  _rot = setInterval(() => {
    if (S.screen !== 'mintika') return;
    let changed = false;
    UNITS.forEach(u => {
      if (S.panelLock[u]) return;
      const i = CLASSES.indexOf(S.panelCls[u]);
      S.panelCls[u] = CLASSES[(i+1) % CLASSES.length];
      changed = true;
      const el = document.getElementById('pb'+u);
      if (el){
        el.classList.remove('fade');
        void el.offsetWidth;
        el.innerHTML = panelBody(mintikaTop(S.panelCls[u], u));
        el.classList.add('fade');
      }
    });
    if (changed) refreshDots();
  }, ROTATE_MS);
}
function stopRotation(){ if(_rot){ clearInterval(_rot); _rot=null; } }

function refreshDots(){
  UNITS.forEach(u => {
    const panel = document.querySelectorAll('.panel')[u-1];
    if (!panel) return;
    panel.querySelectorAll('.dot').forEach((b,i) => {
      b.classList.toggle('on', CLASSES[i] === S.panelCls[u]);
    });
  });
}
/* ══════════════════════════════════════════════════════════════════
   BÖLÜM 7 — YURT İÇİ ANA EKRAN
   ══════════════════════════════════════════════════════════════════ */

function dormHome(){
  let h = `<div class="row" style="margin-bottom:26px">
    <button class="btn btn-primary" style="padding:16px 34px;font-size:17px" onclick="startSetup()">← Talebe Seçimine Dön</button>
    <button class="btn btn-ghost btn-sm" onclick="openMintika()">Vitrin</button></div>`;

  h += `<div class="card"><div class="row" style="gap:6px;margin-bottom:14px">
    <button class="tab ${S.scope==='yurt'?'on':''}" onclick="S.scope='yurt';S.bAll=false;render()">Yurt İçi</button>
    <button class="tab ${S.scope==='mintika'?'on':''}" onclick="S.scope='mintika';S.bAll=false;render()">Mıntıka (tüm yurtlar)</button>
  </div>
  <div class="row" style="gap:6px;margin-bottom:18px;padding-top:12px;border-top:1px solid rgba(232,226,214,.1)">`
  + [['genel','Genel'],['sinif','Sınıf'],['unite','Ünite']]
      .map(([k,l]) => `<button class="tab ${S.bTab===k?'on':''}" onclick="S.bTab='${k}';S.bAll=false;render()">${l} Sıralaması</button>`).join('')
  + '</div>';

  const pool = S.scope==='yurt' ? results.filter(r=>r.dorm===S.dorm) : results;
  if (S.bTab==='genel') h += boardGeneral(pool);
  else if (S.bTab==='sinif') h += boardClass(pool);
  else h += boardUnit(pool);
  h += '</div>';
  return h;
}

/* --- sıralama hesapları --- */

function bestPerUnit(rs){
  const m = new Map();
  rs.forEach(r => {
    const k = r.dorm+'|'+r.name+'|'+r.cls+'|'+r.unit;
    const c = m.get(k);
    if (!c || r.score > c.score) m.set(k, r);
  });
  return [...m.values()];
}

function totals(rs){
  const m = new Map();
  bestPerUnit(rs).forEach(r => {
    const k = r.dorm+'|'+r.name+'|'+r.cls;
    const c = m.get(k) || { name:r.name, cls:r.cls, dorm:r.dorm, score:0, units:0, correct:0, total:0 };
    c.score += r.score; c.units++; c.correct += r.correct; c.total += r.total;
    m.set(k, c);
  });
  return [...m.values()].sort((a,b) => b.score - a.score);
}

function tableHTML(rows, head, rowFn, limit){
  if (!rows.length) return '<p style="color:var(--muted);font-size:14px">Henüz sonuç yok.</p>';
  const lim = limit || 10;
  const shown = S.bAll ? rows : rows.slice(0, lim);
  let h = '<table><thead><tr>'+head+'</tr></thead><tbody>'+shown.map(rowFn).join('')+'</tbody></table>';
  if (rows.length > lim)
    h += `<button class="btn btn-ghost btn-sm" style="margin-top:14px" onclick="S.bAll=!S.bAll;render()">`
       + (S.bAll ? `İlk ${lim} göster` : `Tümünü göster (${rows.length})`) + '</button>';
  return h;
}

const ybadge = id => { const d=dorm(id); return `<span class="yb" style="background:${d.color}22;color:${d.color}">${esc(d.name)}</span>`; };

function boardGeneral(pool){
  const mint = S.scope==='mintika';
  return tableHTML(totals(pool),
    `<th style="width:50px">#</th><th>Talebe</th>${mint?'<th>Yurt</th>':''}<th>Sınıf</th><th>Ünite</th><th>Doğru</th><th>Toplam Puan</th>`,
    (r,i) => `<tr class="${i===0?'top1':''}"><td>${medal(i)}</td><td style="font-weight:600">${esc(r.name)}</td>
      ${mint?`<td>${ybadge(r.dorm)}</td>`:''}<td>${r.cls}. Sınıf</td><td>${r.units}/4</td>
      <td>${r.correct}/${r.total}</td><td style="color:var(--gold);font-weight:700">${r.score}</td></tr>`);
}

function boardUnit(pool){

function myStudents(cls){ return ((students[S.dorm]||{})[cls] || (students[S.dorm]||{})[String(cls)] || []); }

function setup(){
  const q = S.q.toLocaleLowerCase('tr');
  const flat = CLASSES.flatMap(c => myStudents(c).map(n => ({name:n, cls:c})))

function pickStudent(i){ const s = S._flat[i]; if(!s) return; S.picked = {name:s.name, cls:s.cls}; S.unit=null; go('talebeMenu'); }

/* Talebenin TÜM yanlış yaptığı kelimeler (benzersiz), hata sayısıyla.
   Bir kelime = o ünitedeki bir İngilizce sözcük. Yön (en/tr) fark etmez. */
function wrongWords(p){
  const mine = results.filter(r => r.dorm===S.dorm && r.name===p.name && r.cls===p.cls);
  const m = new Map();  // anahtar: cls|unit|en  -> {en,tr,cls,unit,count}
  mine.forEach(r => {
    (r.wrongs||[]).forEach(w => {
      // w.prompt / w.answer ikisinden hangisi İngilizce, kelime listesinden bulunur.
      const pair = kelimeCiftiBul(p.cls, r.unit, w.prompt, w.answer);
      if (!pair) return;
      const k = p.cls + '|' + r.unit + '|' + pair.en;
      const cur = m.get(k) || { en:pair.en, tr:pair.tr, cls:p.cls, unit:r.unit, count:0 };
      cur.count++;
      m.set(k, cur);
    });
  });
  return [...m.values()].sort((a,b) => b.count - a.count || a.unit - b.unit);
}

/* Bir soru-cevap ikilisinden {en,tr} kelime çiftini bulur (yön bağımsız). */
function kelimeCiftiBul(cls, unit, x, y){
  const list = words[wkey(cls, unit)] || [];
  for (const w of list){
    if ((w.en===x && w.tr===y) || (w.tr===x && w.en===y)) return w;
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   YANLIŞLARA ÇALIŞ — ANTRENMAN MODU
   ------------------------------------------------------------------
   • Sadece talebenin yanlış yaptığı kelimelerden soru üretir.
   • Sonuç sıralamaya GİRMEZ, hiçbir yere kaydedilmez (antrenman).
   • Bir kelimeyi 10 kez doğru bilince o kelime artık sorulmaz ("ustalık").
   • Ustalık sayaçları Supabase'de (ayarlar tablosu) tutulur; tüm cihazlarda ortak.
   ══════════════════════════════════════════════════════════════════ */

const USTALIK_HEDEF = 10;  // bir kelime kaç doğruda elenir

function masteryKey(p){ return 'mastery:' + S.dorm + ':' + p.name + ':' + p.cls; }
function wKelKey(w){ return w.cls + '|' + w.unit + '|' + w.en; }  // benzersiz kelime kimliği

async function startDrill(){
  const p = S.picked;
  const key = masteryKey(p);
  // En guncel ustalik sayaclarini yukle (baska cihazda ilerlemis olabilir).
  S.mastery = await DB.loadMastery(key);

  const ww = wrongWords(p);
  // Ustalasilmis (>=10 dogru) kelimeleri cikar.
  const kalan = ww.filter(w => (S.mastery[wKelKey(w)] || 0) < USTALIK_HEDEF);

  if (!kalan.length){
    if (ww.length){
      flash('Tüm yanlış kelimeleri ustalıkla geçtin! 🎉');
    } else {
      flash('Çalışılacak yanlış kelime yok.');
    }
    return;
  }

  S.drill = { key, name:p.name, cls:p.cls, pool:kalan,
              idx:0, correct:0, wrong:0, sel:null, done:false };
  nextDrillQuestion();
  go('drill');
}

/* Havuzdan rastgele bir kelime seçip soru hazırlar (iki yönden biri). */
function nextDrillQuestion(){
  const d = S.drill;
  // Henüz ustalaşılmamış kelimeler (canlı filtre — bu turda 10'a ulaşan çıkar).
  const aktif = d.pool.filter(w => (S.mastery[wKelKey(w)] || 0) < USTALIK_HEDEF);
  if (!aktif.length){ d.done = true; return; }

  const w = aktif[Math.random()*aktif.length | 0];
  const dir = Math.random() < 0.5 ? 'en' : 'tr';       // en: İng→Tür sorusu
  const prompt = dir==='en' ? w.en : w.tr;
  const answer = dir==='en' ? w.tr : w.en;

  // Çeldiriciler: aynı sınıf-ünitedeki diğer kelimelerden.
  const list = words[wkey(w.cls, w.unit)] || [];
  const havuz = [...new Set(list.map(x => dir==='en' ? x.tr : x.en))].filter(v => v !== answer);
  const opts = shuffle([answer, ...shuffle(havuz).slice(0,3)]);

  d.cur = { w, dir, prompt, answer, opts };
  d.sel = null;
}

function drillScreen(){
  const d = S.drill;
  if (!d){ S.screen='talebeMenu'; return talebeMenu(); }

  // Kaç kelime ustalıkla geçildi?
  const toplam = d.pool.length;
  const gecildi = d.pool.filter(w => (S.mastery[wKelKey(w)] || 0) >= USTALIK_HEDEF).length;

  let h = `<div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div><strong style="color:var(--paper)">${esc(d.name)}</strong>
      <span class="pill">Antrenman · yanlışlara çalış</span></div>
    <div class="row" style="gap:14px">
      <span style="color:var(--muted);font-size:14px">Ustalık: ${gecildi}/${toplam}</span>
      <button class="btn btn-ghost btn-sm" onclick="bitirDrill()">Bitir</button></div></div>`;

  if (d.done || gecildi >= toplam){
    h += `<div class="card" style="text-align:center;padding:36px 20px">
      <div class="score" style="font-size:52px">🎉</div>
      <h2 style="margin:6px 0;color:var(--paper)">Tebrikler!</h2>
      <p style="color:var(--muted);font-size:15px;max-width:440px;margin:0 auto">
        Bu oturumdaki tüm kelimeleri ustalıkla geçtin. Bu antrenmanın sıralamaya etkisi yoktur —
        sadece pekiştirmek içindir.</p>
      <div class="row" style="justify-content:center;margin-top:22px">
        <button class="btn btn-primary" onclick="go('talebeMenu')">Menüye dön</button></div></div>`;
    return h;
  }

  const c = d.cur;
  const kalanDogru = USTALIK_HEDEF - (S.mastery[wKelKey(c.w)] || 0);
  h += `<div class="bar"><div style="width:${toplam?(gecildi/toplam*100):0}%"></div></div>
    <div class="card" style="text-align:center">
      <div class="eyebrow">${c.dir==='en' ? 'İngilizce → Türkçe' : 'Türkçe → İngilizce'} · Ünite ${c.w.unit}</div>
      <div class="big">${esc(c.prompt)}</div>
      <div style="font-size:12px;color:var(--muted)">Bu kelimeyi elemek için ${kalanDogru} doğru daha</div></div>`;

  c.opts.forEach((o,i) => {
    let cls = 'opt';
    if (d.sel){ if (o === c.answer) cls += ' correct'; else if (d.sel === o) cls += ' wrong'; }
    h += `<button class="${cls}" onclick="drillChoose(${i})">${esc(o)}</button>`;
  });

  h += `<p style="color:var(--muted);font-size:13px;margin-top:14px">Doğru: ${d.correct} · Yanlış: ${d.wrong}</p>`;
  return h;
}

async function drillChoose(i){
  const d = S.drill; if (d.sel !== null) return;
  const c = d.cur, opt = c.opts[i];
  d.sel = opt;
  const key = wKelKey(c.w);

  if (opt === c.answer){
    d.correct++;
    S.mastery[key] = (S.mastery[key] || 0) + 1;
    // Her doğruda Supabase'e yaz (arka planda; beklemeyiz).
    DB.saveMastery(d.key, S.mastery);
  } else {
    d.wrong++;
    // Yanlışta sayaç sıfırlanır — üst üste değil toplam 10 doğru mantığı için

function beginQuiz(){
  const list = words[wkey(S.picked.cls, S.unit)] || [];
  const base = [];
  list.forEach(w => {
    base.push({p:w.en, a:w.tr, dir:'en', pool:'tr'});
    base.push({p:w.tr, a:w.en, dir:'tr', pool:'en'});
  });
  // Güvenlik: kelime yoksa yarışma başlatılamaz (sonsuz döngüyü önler).
  if (base.length < 8){
    flash('Bu ünitede yeterli kelime yok. Yönetici panelinden kelime eklenmeli.');
    S.unit = null; render();
    return;
  }
  // Havuzu karıştırarak TOTAL_Q soruya tamamla; kelimeler bitince baştan döner.
  const picked = [];
  while (picked.length < TOTAL_Q){
    for (const q of shuffle(base)){ if (picked.length >= TOTAL_Q) break; picked.push(q); }
  }
  const questions = picked.map(q => {
    const others = [...new Set(list.map(w => q.pool==='tr' ? w.tr : w.en))].filter(v => v !== q.a);
    return {...q, opts: shuffle([q.a, ...shuffle(others).slice(0,3)])};
  });

  S.quiz = { name:S.picked.name, cls:S.picked.cls, unit:S.unit, questions,
             idx:0, correct:0, wrongs:[], sel:null, start:Date.now(), sec:0 };
  go('quiz');
  clearInterval(window._tick);
  window._tick = setInterval(() => {
    if (S.screen !== 'quiz'){ clearInterval(window._tick); return; }
    S.quiz.sec = Math.floor((Date.now() - S.quiz.start)/1000);
    const e = document.getElementById('tmr');
    if (e) e.textContent = fmt(S.quiz.sec);
  }, 500);
}

function quiz(){
  const z = S.quiz, q = z.questions[z.idx];
  const pct = ((z.idx + (z.sel?1:0)) / z.questions.length) * 100;
  let h = `<div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div><strong style="color:var(--paper)">${esc(z.name)}</strong>
      <span class="pill">${z.cls}. Sınıf · Ünite ${z.unit}</span> ${ybadge(S.dorm)}</div>
    <div class="row" style="gap:18px"><span class="timer" id="tmr">${fmt(z.sec)}</span>
      <span style="color:var(--muted);font-size:14px">${z.idx+1}/${z.questions.length}</span>
      <button class="btn btn-ghost btn-sm" onclick="bitirQuiz()">Yarışı Bitir</button>
      <button class="btn btn-danger btn-sm" onclick="abortQuiz()">Çık</button></div></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="card" style="text-align:center">
      <div class="eyebrow">${q.dir==='en' ? 'İngilizce → Türkçe' : 'Türkçe → İngilizce'}</div>
      <div class="big">${esc(q.p)}</div></div>`;
  q.opts.forEach((o,i) => {
    let cls = 'opt';
    if (z.sel){ if (o === q.a) cls += ' correct'; else if (z.sel === o) cls += ' wrong'; }
    h += `<button class="${cls}" onclick="choose(${i})">${esc(o)}</button>`;
  });
  h += `<p style="color:var(--muted);font-size:13px;margin-top:14px">Doğru: ${z.correct} · Yanlış: ${z.wrongs.length}</p>`;
  return h;
}

function abortQuiz(){
  if (confirm('Yarışma yarıda bitirilsin mi? Sonuç KAYDEDİLMEZ.')){
    clearInterval(window._tick); goHome();
  }
}

/* Yarisi erken bitirir ve o ana kadarki sonucu KAYDEDER.
   Cevaplanmamis sorular yanlis sayilmaz; toplam, cozulen soru sayisidir. */
function bitirQuiz(){
  const z = S.quiz;
  const cozulen = z.idx + (z.sel ? 1 : 0);
  if (!cozulen){
    flash('En az bir soru cevaplamalısın.');
    return;
  }
  const kalan = z.questions.length - cozulen;
  if (!confirm('Yarışma şimdi bitirilsin mi?\n\n' + cozulen + ' soru çözüldü, ' +
               kalan + ' soru boş kalacak.\nSonuç bu haliyle kaydedilecek.')) return;
  clearInterval(window._tick);
  finishQuiz(cozulen);
}

function choose(i){
  const z = S.quiz; if (z.sel !== null) return;
  const q = z.questions[z.idx], opt = q.opts[i];
  z.sel = opt;
  if (opt === q.a) z.correct++;
  else z.wrongs.push({prompt:q.p, answer:q.a, given:opt});
  render();
  setTimeout(() => {
    if (z.idx + 1 >= z.questions.length) finishQuiz();
    else { z.idx++; z.sel = null; render(); }
  }, 550);
}

async function finishQuiz(cozulen){
  clearInterval(window._tick);
  const z = S.quiz;
  // Erken bitirmede toplam, cozulen soru sayisidir; bos sorular yanlis sayilmaz.
  const toplam = (typeof cozulen === 'number' && cozulen > 0) ? cozulen : z.questions.length;
  const seconds = Math.floor((Date.now() - z.start)/1000);
  const bonus = Math.max(0, toplam*10 - seconds) * 0.5;
  const res = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    dorm: S.dorm, name: z.name, cls: z.cls, unit: z.unit,
    correct: z.correct, total: toplam, seconds,
    score: Math.round(z.correct*10 + bonus),
    wrongs: z.wrongs, date: Date.now()
  };
  results.push(res);
  const yazildi = await DB.addResult(res);
  if (!yazildi){
    // Kaydedilemedi: kullaniciyi uyar, sonuc yerel olarak gorunmeye devam etsin.
    flash('Sonuç kaydedilemedi! İnternet bağlantısını kontrol edin.');
    res._kaydedilmedi = true;
  }
  S.last = res;
  go('result');
  // Diger bilgisayarlarin sonucu gormesi icin ortak listeyi hemen tazele.
  setTimeout(tazele, 800);
}

  const prev = results.filter(x => x.dorm===r.dorm && x.name===r.name && x.cls===r.cls && x.unit===r.unit && x.id!==r.id);

  let badge;
  if (prevBest === null) badge = '<div style="color:var(--muted);font-size:14px;margin-top:8px">Bu ünitedeki ilk denemen.</div>';

  else badge = `<div style="color:var(--muted);font-size:14px;margin-top:8px">En iyi puanın ${prevBest} olarak kalıyor. Sıralamada o sayılır.</div>`;

  // mıntıka sırası

  let h = '';
  if (r._kaydedilmedi){
    h += `<div class="card" style="border-color:rgba(178,69,60,.5);background:rgba(178,69,60,.12)">
      <b style="color:#f0a49d">⚠ Sonuç sunucuya kaydedilemedi.</b>
      <p style="color:var(--muted);font-size:13px;margin:8px 0 0">
        Bu puan sıralamaya girmeyecek. İnternet bağlantısını kontrol edip yarışmayı tekrarlayın.</p></div>`;
  }
  h += `<div class="card" style="text-align:center">
    <div style="font-size:13px;color:var(--muted)">${esc(r.name)} · ${r.cls}. Sınıf · Ünite ${r.unit} · ${esc(dorm(r.dorm).name)}</div>
    <div class="score">${r.score}</div><div style="color:var(--muted);font-size:14px">puan</div>${badge}
    <div class="row" style="justify-content:center;gap:34px;margin-top:24px">
      <div class="stat"><b>${r.correct}/${r.total}</b><span>Doğru</span></div>
      <div class="stat"><b>${fmt(r.seconds)}</b><span>Süre</span></div>
      <div class="stat"><b>%${Math.round(r.correct/r.total*100)}</b><span>Başarı</span></div>
      <div class="stat"><b>${bonus}</b><span>Hız bonusu</span></div>
      ${rank>=0 ? `<div class="stat"><b>${rank+1}.</b><span>Mıntıka sırası</span></div>` : ''}
    </div></div>`;

  if (r.wrongs.length){
    h += `<div class="card"><h3 style="margin-top:0;font-size:18px">Yanlışlar (${r.wrongs.length})</h3>
      <table><thead><tr><th>Soru</th><th>Doğru cevap</th><th>Verilen</th></tr></thead><tbody>`
      + r.wrongs.map(w => `<tr><td>${esc(w.prompt)}</td><td style="color:var(--green)">${esc(w.answer)}</td>
          <td style="color:#f0a49d">${esc(w.given)}</td></tr>`).join('')
      + '</tbody></table></div>';
  }
  h += `<div class="row"><button class="btn btn-primary" onclick="goHome()">Sıralamayı gör</button>
    <button class="btn btn-ghost" onclick="againSame()">Bu üniteyi tekrar dene</button>

  return h;
}

function trackAdmin(){
  const scope = S.tCls || 'all';
  const siniflar = scope === 'all' ? CLASSES : [Number(scope)];
  const ara = (S.tQ || '').toLocaleLowerCase('tr');

  let satirlar = [];
  siniflar.forEach(c => {
    const liste = ((students[S.dorm]||{})[c] || (students[S.dorm]||{})[String(c)] || []);
    liste.forEach(name => {
      const durum = UNITS.map(u => {
        const d = results.filter(r => r.dorm===S.dorm && r.name===name && r.cls===c && r.unit===u);
        if (!d.length) return null;
        return { tries: d.length, best: Math.max(...d.map(x => x.score)),
                 correct: d.reduce((a,x) => x.score > a.score ? x : a).correct };
      });
      satirlar.push({ name, cls:c, durum, yapilan: durum.filter(Boolean).length });
    });
  });

  if (ara) satirlar = satirlar.filter(s => s.name.toLocaleLowerCase('tr').includes(ara));
  if (S.tOnly === 'eksik') satirlar = satirlar.filter(s => s.yapilan < 4);
  else if (S.tOnly === 'hic') satirlar = satirlar.filter(s => s.yapilan === 0);

  const sirala = S.tSort || 'isim';
  if (sirala === 'eksik') satirlar.sort((a,b) => a.yapilan - b.yapilan || trSort(a.name,b.name));
  else if (sirala === 'tam') satirlar.sort((a,b) => b.yapilan - a.yapilan || trSort(a.name,b.name));
  else satirlar.sort((a,b) => a.cls - b.cls || trSort(a.name,b.name));

  // özet
  const tumu = [];
  CLASSES.forEach(c => ((students[S.dorm]||{})[c] || (students[S.dorm]||{})[String(c)] || []).forEach(n => tumu.push({n,c})));
  const toplamHucre = tumu.length * 4;
  const yapilanHucre = tumu.reduce((a,t) => a + UNITS.filter(u =>
    results.some(r => r.dorm===S.dorm && r.name===t.n && r.cls===t.c && r.unit===u)).length, 0);
  const oran = toplamHucre ? Math.round(yapilanHucre/toplamHucre*100) : 0;

  let h = `<div class="card">
  <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:4px">
    <h3 style="margin:0">Takip Çizelgesi</h3>
    <span style="color:var(--muted);font-size:13px">${esc(dorm(S.dorm).name)} · ${tumu.length} talebe · %${oran} tamamlandı</span></div>
  <p style="color:var(--muted);font-size:13px;margin:6px 0 16px">
    <span class="tick ok">✓</span> yapmış &nbsp;·&nbsp; <span class="tick no">✕</span> yapmamış &nbsp;·&nbsp; kutuya dokunun, en iyi puanı görün</p>

  <div class="row" style="margin-bottom:16px">
    <div style="min-width:150px"><label>Sınıf</label><select onchange="S.tCls=this.value;render()">
      <option value="all" ${scope==='all'?'selected':''}>Tüm sınıflar</option>
      ${CLASSES.map(c=>`<option value="${c}" ${String(scope)===String(c)?'selected':''}>${c}. Sınıf</option>`).join('')}</select></div>
    <div style="min-width:170px"><label>Göster</label><select onchange="S.tOnly=this.value;render()">
      <option value="hepsi" ${(S.tOnly||'hepsi')==='hepsi'?'selected':''}>Hepsi</option>
      <option value="eksik" ${S.tOnly==='eksik'?'selected':''}>Eksiği olanlar</option>
      <option value="hic" ${S.tOnly==='hic'?'selected':''}>Hiç girmeyenler</option></select></div>
    <div style="min-width:170px"><label>Sırala</label><select onchange="S.tSort=this.value;render()">
      <option value="isim" ${sirala==='isim'?'selected':''}>Sınıf ve isme göre</option>
      <option value="eksik" ${sirala==='eksik'?'selected':''}>En çok eksiği olan</option>
      <option value="tam" ${sirala==='tam'?'selected':''}>En çok tamamlayan</option></select></div>
    <div style="flex:1;min-width:180px"><label>Ara</label>
      <input placeholder="Talebe adı" value="${esc(S.tQ||'')}" oninput="S.tQ=this.value;render()"></div>
  </div>`;

  if (!tumu.length)
    return h + '<p style="color:var(--muted);font-size:14px">Bu yurtta kayıtlı talebe yok. Talebeler sekmesinden ekleyin.</p></div>';
  if (!satirlar.length)
    return h + '<p style="color:var(--muted);font-size:14px">Bu filtreye uyan talebe yok.</p></div>';

  h += `<div style="overflow-x:auto"><table><thead><tr>
    <th style="width:36px">#</th><th>Talebe</th><th style="width:60px">Sınıf</th>
    ${UNITS.map(u=>`<th style="width:76px;text-align:center">Ünite ${u}</th>`).join('')}
    <th style="width:80px;text-align:center">Durum</th></tr></thead><tbody>`;

  satirlar.forEach((s,i) => {
    const tam = s.yapilan === 4, hic = s.yapilan === 0;
    h += `<tr><td style="color:var(--muted);font-size:12px">${i+1}</td>
      <td style="font-weight:600">${esc(s.name)}</td>

    s.durum.forEach((d,j) => {

        : `<td style="text-align:center"><span class="tick no" title="Ünite ${UNITS[j]} yapılmadı">✕</span></td>`;
    });
    h += `<td style="text-align:center;font-size:12px;font-weight:600;color:${tam?'var(--green)':hic?'var(--rose)':'var(--gold)'}">${s.yapilan}/4</td></tr>`;
  });

  h += '</tbody></table></div>';
  h += `<div class="row" style="margin-top:16px">
    <button class="btn btn-ghost btn-sm" onclick="copyTrack()">Listeyi kopyala</button>
    <span style="color:var(--muted);font-size:12px;align-self:center">${satirlar.length} talebe listeleniyor</span></div></div>`;
  return h;
}

function copyTrack(){
  const siniflar = (S.tCls && S.tCls!=='all') ? [Number(S.tCls)] : CLASSES;
  let out = dorm(S.dorm).name + ' — Takip Çizelgesi\n\n';
  siniflar.forEach(c => {
    const liste = ((students[S.dorm]||{})[c] || (students[S.dorm]||{})[String(c)] || []);
    if (!liste.length) return;
    out += c + '. SINIF\n';
    liste.forEach(name => {
      const im = UNITS.map(u =>
        results.some(r => r.dorm===S.dorm && r.name===name && r.cls===c && r.unit===u) ? '✓' : '✕').join(' ');
      out += '  ' + name.padEnd(28,' ') + im + '\n';
    });
    out += '\n';
  });
  if (navigator.clipboard) navigator.clipboard.writeText(out).then(()=>flash('Panoya kopyalandı'));
  else flash('Kopyalanamadı');
}

const YURT_RENKLERI = ['#C8A44D','#4EA87C','#5B9BD5','#C77DBB','#E08A4B','#7FB069','#9B8BD4','#D96C6C'];

function yurtId(ad){
  const harita = {'ç':'c','ğ':'g','ı':'i','İ':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'};
  let s = ad.toLocaleLowerCase('tr').split('').map(c => harita[c] || c).join('');
  s = s.replace(/[^a-z0-9]/g,'');
  if (!s) s = 'yurt';
  let sonuc = s, n = 2;
  while (DORMS.some(d => d.id === sonuc)) sonuc = s + n++;
  return sonuc;
}

async function yurtEkle(){
  const ad = document.getElementById('ynAd').value.trim();
  const sf = document.getElementById('ynSifre').value.trim();
  if (!ad){ flash('Yurt adı girin.'); return; }
  if (sf.length < 4){ flash('Şifre en az 4 karakter olmalı.'); return; }
  if (DORMS.some(d => d.name.toLocaleLowerCase('tr') === ad.toLocaleLowerCase('tr'))){
    flash('Bu isimde bir yurt zaten var.'); return;
  }
  if (DORMS.some(d => d.pass.toLocaleLowerCase('tr') === sf.toLocaleLowerCase('tr'))){
    flash('Bu şifre başka bir yurtta kullanılıyor.'); return;
  }
  DORMS = [...DORMS, { id: yurtId(ad), name: ad, pass: sf,
                       color: YURT_RENKLERI[DORMS.length % YURT_RENKLERI.length] }];
  const ok = await DB.saveDorms(DORMS);
  flash(ok ? ad + ' eklendi' : 'Kaydedilemedi');
  render();
}

async function yurtGuncelle(i, alan, deger){
  const v = deger.trim();
  if (!v){ flash('Boş bırakılamaz.'); render(); return; }
  if (alan === 'pass' && v.length < 4){ flash('Şifre en az 4 karakter olmalı.'); render(); return; }
  if (alan === 'pass' && DORMS.some((d,j) => j !== i && d.pass.toLocaleLowerCase('tr') === v.toLocaleLowerCase('tr'))){
    flash('Bu şifre başka bir yurtta kullanılıyor.'); render(); return;
  }
  if (alan === 'name' && DORMS.some((d,j) => j !== i && d.name.toLocaleLowerCase('tr') === v.toLocaleLowerCase('tr'))){
    flash('Bu isimde bir yurt zaten var.'); render(); return;
  }
  DORMS = DORMS.map((d,j) => j === i ? {...d, [alan]: v} : d);
  const ok = await DB.saveDorms(DORMS);
  flash(ok ? 'Kaydedildi' : 'Kaydedilemedi');
  render();
}

async function yurtSil(i){
  const d = DORMS[i];
  if (!d) return;
  if (d.id === WORD_ADMIN){ flash('Yönetici yurt silinemez.'); return; }
  const tal = Object.values(students[d.id] || {}).reduce((a,l) => a + (l?l.length:0), 0);
  const son = results.filter(r => r.dorm === d.id).length;
  if (!confirm(d.name + ' yurdu silinecek.\n\n' + tal + ' talebe ve ' + son +
               ' yarışma sonucu da silinecek.\n\nBu işlem geri alınamaz. Devam edilsin mi?')) return;

  DORMS = DORMS.filter((_,j) => j !== i);
  delete students[d.id];
  results = results.filter(r => r.dorm !== d.id);

  await DB.saveDorms(DORMS);
  await DB.saveStudents(students);
  await DB.deleteDormResults(d.id);

  // Silinen yurdun vitrin panelleri bozulmasin
  flash(d.name + ' silindi');
  render();
}

async function boot(){
  // Veritabani TEK SEFER okunur; eksikler bellekte tamamlanip ekran hemen
  // cizilir. Veritabanina yazma islemi arka planda yapilir, kullanici beklemez.
  const d = await DB.load();

  // YURTLAR: veritabanindaki liste kullanilir, yoksa varsayilanlar yazilir.
  if (Array.isArray(d.dorms) && d.dorms.length){
    DORMS = d.dorms;
  } else {
    DORMS = VARSAYILAN_YURTLAR.map(x => ({...x}));
    DB.saveDorms(DORMS);
  }

  const dbKelime = (d.words    && typeof d.words    === 'object') ? d.words    : {};
  const dbTalebe = (d.students && typeof d.students === 'object') ? d.students : {};

  // KELIMELER: eksik uniteler tamamlanir, mevcut uniteler korunur.
  words = {...dbKelime};
  let kelimeDegisti = false;
  Object.keys(HAZIR_KELIMELER).forEach(k => {
    if (!(words[k] && words[k].length)){ words[k] = HAZIR_KELIMELER[k]; kelimeDegisti = true; }
  });

  // TALEBELER: bos siniflar doldurulur, DOLU olanlara dokunulmaz.
  students = {...dbTalebe};
  let talebeDegisti = false;
  Object.keys(HAZIR_TALEBELER).forEach(yurt => {
    students[yurt] = {...(students[yurt] || {})};
    Object.keys(HAZIR_TALEBELER[yurt]).forEach(sinif => {
      const varOlan = students[yurt][sinif];
      if (!(varOlan && varOlan.length)){
        students[yurt][sinif] = [...HAZIR_TALEBELER[yurt][sinif]];
        talebeDegisti = true;
      }
    });
  });

  results = Array.isArray(d.results) ? d.results : [];
  adminPass = ls(LS.pass, ADMIN_PASS_DEFAULT);

  // Yazma islemleri ekrani bekletmez.
  if (kelimeDegisti) DB.saveWords(words);
  if (talebeDegisti) DB.saveStudents(students);

  DB.watch(tazele);          // anlik bildirim (Realtime acikssa)
  startAutoRefresh();        // yedek: duzenli yenileme

  render();
}

/* ── Veriyi yeniden cekip ekrani tazeler ─────────────────────────────
   Supabase Realtime kapali olsa bile sonuclarin diger bilgisayarlara
   ulasmasini garantiler.                                            */
let _tazeleniyor = false;
async function tazele(){
  if (_tazeleniyor) return;          // ust uste calismasin
  if (S.screen === 'quiz') return;   // yarisma sirasinda dokunma
  _tazeleniyor = true;
  try{
    const n = await DB.load();
    const oncekiSonuc = results.length;
    if (Array.isArray(n.results)) results = n.results;
    if (n.words && Object.keys(n.words).length) words = n.words;
    if (n.students && Object.keys(n.students).length) students = n.students;
    if (Array.isArray(n.dorms) && n.dorms.length) DORMS = n.dorms;

    if (S.screen === 'mintika'){
      // Vitrin panellerini yerinde tazele (tum ekrani cizmeye gerek yok)
      UNITS.forEach(u => {
        const el = document.getElementById('pb'+u);
        if (el) el.innerHTML = panelBody(mintikaTop(S.panelCls[u], u));
      });
    } else if ((S.screen === 'dorm' || S.screen === 'rekorlar') && results.length !== oncekiSonuc){
      // Yurt ici siralama ekrani aciksa tazele
      render();
    }
  }catch(e){
    console.error('Tazeleme hatasi:', e);
  }finally{
    _tazeleniyor = false;
  }
}

/* Duzenli yenileme: 15 saniyede bir. Sekme arka plandayken calismaz. */
let _oto = null;
function startAutoRefresh(){
  if (_oto) clearInterval(_oto);
  _oto = setInterval(() => {
    if (document.hidden) return;              // sekme gorunmuyorsa bosuna cekme
    if (S.screen === 'quiz') return;          // yarisma sirasinda dokunma
    if (S.screen === 'admin' && S.aTab !== 'takip') return;  // form doldurulurken bozma
    tazele();
  }, 15000);
}

/* ══════════════════════════════════════════════════════════════════
   ORTAK VERİTABANI ÖRNEĞİ (Supabase)
   ------------------------------------------------------------------
   1) <head> icine su etiketi ekleyin (kose parantezlerle):
      script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
   2) BÖLÜM 1'deki DB nesnesini şununla değiştirin:

   const sb = supabase.createClient('PROJE_URL', 'ANON_KEY');
   const DB = {
     async load(){
       const [w,s,r] = await Promise.all([
         sb.from('ayarlar').select('deger').eq('anahtar','words').single(),
         sb.from('ayarlar').select('deger').eq('anahtar','students').single(),
         sb.from('sonuclar').select('*').order('date')
       ]);
       return { words: w.data?.deger || null,
                students: s.data?.deger || null,
                results: r.data || [] };
     },
     async saveWords(w){ await sb.from('ayarlar').upsert({anahtar:'words', deger:w}); return true; },
     async saveStudents(s){ await sb.from('ayarlar').upsert({anahtar:'students', deger:s}); return true; },
     async addResult(r){ await sb.from('sonuclar').insert(r); return true; },
     async replaceResults(list){
       await sb.from('sonuclar').delete().neq('id','');
       if (list.length) await sb.from('sonuclar').insert(list);
       return true;
     },
     watch(fn){
       sb.channel('canli')
         .on('postgres_changes', {event:'*', schema:'public'}, fn)
         .subscribe();
     }
   };

   Gereken tablolar:
